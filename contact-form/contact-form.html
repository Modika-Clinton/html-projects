<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Form</title>
        <style>
            body {
                font-family:'Comic Sans MS';
                border: 2px solid #bbc;
                padding: 100px;
                max-width: 40%;
            }
            ul {
                list-style-type:none;
                padding: 0;
                margin: 0;
                overflow: hidden;
            }
            li {
                float: left;
                text-align: center;
                padding: 15px;
            }
            hr {
                border: 1px solid black;
            }
            
        </style>
    </head>
    <body>
        <header>
            <h1>Acme Support</h1>
            <div>
                <ul>
                    <li>Home</li>
                    <li>Help</li>
                    <li>Contact</li>
                </ul>
            </div>
        </header>
        <hr>
        <main>
            <section>
                <h1>Contact us</h1>
                <p>
                    Send us a message and 
                    we will get back to you.
                </p>
                <form action="/action_page.php" target="_blank" method="post">
                    <label for="full_name">Full name</label>
                    <input type="text" id="full_name" name="full_name" style="width:30%;height:20px;" required><br><br>
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" style="width:30%;height:20px;" required><br><br>
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject" style="width:35%;height:30px;">
                        <option value="Choose a topic">Choose a topic</option>
                        <option value="HTML">HTML</option>
                        <option value="CSS">CSS</option>
                        <option value="JavaScript">JavaScript</option>
                    </select><br><br>
                    <label for="message">Message</label>
                    <textarea name="message" rows="8" cols="30"></textarea>
                </form>
            </section>
            <section>
                <p>How did you hear about us?</p>
                <form action="/action_page.php">
                    <input type="radio" id="search" name="search" value="info_source">
                    <label for="search">Search</label><br>
                    <input type="radio" id="friend" name="friend" value="info_source">
                    <label for="friend">Friend</label><br>
                    <input type="radio" id="socialm" name="socilam" value="info_source">
                    <label for="socialm">Social media</label><br><br>
                    <input type="checkbox" id="update" name="update" value="check">
                    <label for="update">Send me products updates</label><br><br>
                    <input type="submit" value="Send message" style="width:20%;height:30px;font-family:Comic Sans MS;">
                </form>
            </section><br>
        </main>
        <hr><br>
        <footer>&copy; 2026 Acme Support</footer>
    </body>
</html>
