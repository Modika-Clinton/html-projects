<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Comparison Table</title>

<style>
  body {
    font-family:"Comic sans Ms";
    max-width: 100%;
    padding: 50px;
  }
  ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
}
li {
  float:left;
  text-align: center;
  padding:5px;
}
  table, td {
    border: 2px solid black;
    border-collapse: collapse;
    padding:15px;
  }
  
</style>
</head>
<body>

  <!--Header section of the page table-->
  <header>
    <p>Acme Plans</p>
  </header>

<!--This section is reserved for the navigation pane-->
<section>
  <ul>
    <li>Home</li>
    <li>About</li>
    <li>Contact</li>
  </ul>
    
</section>

  <!--This section carries the main information of the table-->
  <table>
    <caption style="text-align: left;">Plan comparison</caption>
    <tr>
      <td>Plan</td>
      <td>Storage</td>
      <td>Projects</td>
      <td>Support</td>
    </tr>

    <tr>
      <td>Free</td>
      <td>5 GB</td>
      <td>3</td>
      <td>Email</td>
    </tr>

    <tr>
      <td>Pro</td>
      <td>100 GB</td>
      <td>25</td>
      <td>Priority Email</td>
    </tr>

    <tr>
      <td>Business</td>
      <td>1 TB</td>
      <td>Unlimited</td>
      <td>24/7 Phone</td>
    </tr>

    <tr>
      <td colspan="4">All plans include SSL and daily backups</td>
    </tr>
  </table>

  <footer>
    <p>&copy; 2025 Mysite</p>
  </footer>


</body>
</html>
